# Builds the hakuX debug APK (arm64-v8a) on demand: Actions -> Build APK ->
# Run workflow, choosing the branch. The steps follow android/README.md; the
# APK is attached to a pre-release named after the branch and run, and kept
# as the run's artifact.
#
# Signing: the repository secret DEBUG_KEYSTORE_B64 (a debug keystore,
# base64; store and key password "android", alias androiddebugkey) signs
# every build with the same key, so each one installs over the last. A build
# without it, or whose certificate isn't DEBUG_CERT_SHA256 (that keystore's),
# fails: a throwaway key's APK can't update the one installed, and the
# reinstall it takes once lost the app's mod choices (every release up to
# build 17 had its own key).
name: Build APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: Attach the APK to a GitHub pre-release
        type: boolean
        default: true
      cpu:
        description: CPUs the native core is built for (HAKUX_ARCH)
        type: choice
        default: snapdragon-865-up
        options:
          - snapdragon-865-up   # armv8.2-a+fp16+dotprod+rcpc: SD865 and newer (the S24+'s 8 Gen 3)
          - generic             # armv8-a+crc: any arm64 phone, atomics through library calls

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865
  # The debug key's certificate (SHA-256): keytool -list -v -keystore
  # debug.keystore -storepass android (the one in DEBUG_KEYSTORE_B64)
  DEBUG_CERT_SHA256: 2C3E189E307D7357133559C2A2CD8F0D9638E98C02B6E9ECCE5B89AEF6C67C9D
  DEPS: ${{ github.workspace }}/../native-deps

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: FEX fork and the submodules it builds with
        run: |
          git submodule update --init --depth 1 external/fex
          git -C external/fex submodule update --init --depth 1 External/fmt External/range-v3 \
            External/rpmalloc External/unordered_dense External/xxhash Source/Common/cpp-optparse

      - name: Third-party sources (android/README.md revisions)
        run: |
          set -euo pipefail
          mkdir -p "$DEPS/root/subprojects"
          cd "$DEPS"
          shallow() { git clone -q --depth 1 --branch "$2" "$1" "$3"; }
          shallow https://github.com/zeux/volk 1.4.304 volk
          shallow https://github.com/KhronosGroup/glslang 16.1.0 glslang
          shallow https://github.com/KhronosGroup/SPIRV-Reflect vulkan-sdk-1.4.328.0 spirv_reflect
          shallow https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator v3.3.0 vma
          shallow https://github.com/libsdl-org/SDL release-3.4.18 SDL3
          # libslirp 26be815b (after the 4.7.0 tag: slirp_ssize_t)
          git clone -q https://gitlab.freedesktop.org/slirp/libslirp.git libslirp
          git -C libslirp checkout -q 26be815b
          # adrenotools 8fae8ce with the KGSL context priority hook
          git clone -q https://github.com/bylaws/libadrenotools adrenotools
          git -C adrenotools checkout -q 8fae8ce
          git -C adrenotools submodule update --init --recursive --depth 1
          git -C adrenotools apply "$GITHUB_WORKSPACE/tools/native/adrenotools-kgsl-context-priority.patch"
          # nv2a_vsh_cpu at the revision xemu's subprojects/nv2a_vsh_cpu.wrap pins
          git clone -q https://github.com/abaire/nv2a_vsh_cpu root/subprojects/nv2a_vsh_cpu
          git -C root/subprojects/nv2a_vsh_cpu checkout -q 89315e8eff62605d2a96fe14429ebeac1dacaa8c

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Android SDK 36, Build Tools 36.1.0, NDK
        run: |
          set -euo pipefail
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" --install "platforms;android-36" "build-tools;36.1.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build > /dev/null

      - name: Native core (libhakuxcore.so)
        run: |
          set -euo pipefail
          case "${{ inputs.cpu }}" in
            generic) arch= ;;
            *) arch=armv8.2-a+fp16+dotprod+rcpc ;;
          esac
          echo "HAKUX_ARCH=${arch:-generic}"
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release \
            -DNC_DEPS="$DEPS" -DHAKUX_ARCH="$arch"
          ninja -C build/native/core hakuxcore
          bash tools/native/app-libs.sh

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -z "$KEYSTORE" ]; then
            echo "::error::No DEBUG_KEYSTORE_B64 secret: the APK would get a throwaway key and not install over the last build. Add the secret (the debug keystore, base64)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          got=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey |
            sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | head -n 1)
          if [ "$got" != "$DEBUG_CERT_SHA256" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 holds another key (certificate SHA-256 $got, expected $DEBUG_CERT_SHA256)."
            exit 1
          fi
          echo "Signing with the repository's debug key (certificate SHA-256 $got)."

      - name: APK
        working-directory: android
        run: |
          chmod +x gradlew
          # gradle.properties names a local JDK (org.gradle.java.home); the
          # user's gradle.properties, read over the project's, gives this one.
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties
          # Maven Central answers runners with 429 now and then: try again
          for i in 1 2 3; do
            ./gradlew --no-daemon assembleDebug && exit 0
            echo "::warning::gradle attempt $i failed; retrying in $((i * 60)) s"
            sleep $((i * 60))
          done
          exit 1

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME//\//-}"
          sha="$(git rev-parse --short HEAD)"
          cpu="${{ inputs.cpu }}"; [ "$cpu" = generic ] && cpu=generic || cpu=sd865up
          name="hakuX-debug-${branch}-${GITHUB_RUN_NUMBER}-${sha}-${cpu}.apk"
          src="$(ls android/app/build/outputs/apk/debug/*.apk | head -1)"
          cp "$src" "$name"
          # signed with the debug key (APK Signature Scheme v2/v3: apksigner)
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          got=$("$signer" verify --print-certs "$name" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'a-f' 'A-F')
          if [ "$got" != "$DEBUG_CERT_SHA256" ]; then
            echo "::error::$name is signed with certificate SHA-256 '$got', not the debug key's $DEBUG_CERT_SHA256."
            exit 1
          fi
          echo "$name: signed with the debug key ($got)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=build-${branch}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Keep as the run's artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Pre-release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "hakuX debug: ${GITHUB_REF_NAME} #${GITHUB_RUN_NUMBER}" \
            --notes "Debug build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Installs as \"hakuX Debug\", beside the regular hakuX."
